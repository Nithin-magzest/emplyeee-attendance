<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagHR Premier — Multi-Factor Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/tabler-icons.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #070B19;
      --card: rgba(13, 20, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #4F46E5;
      --accent-hover: #4338CA;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-dark: #6B7280;
      --input-bg: rgba(255, 255, 255, 0.03);
      --input-border: rgba(255, 255, 255, 0.1);
      --input-focus: #6366F1;
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.3);
      --error-text: #FCA5A5;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
      color: var(--text-main);
    }

    #bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    .bg-mesh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 15% 15%, rgba(79, 70, 229, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 85% 85%, rgba(99, 102, 241, 0.12) 0%, transparent 55%);
    }

    .mfa-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 440px;
      padding: 24px;
    }

    .mfa-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 42px 38px 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 24px 64px -12px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      text-align: center;
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .mfa-logo {
      width: 58px; height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
      color: #FFFFFF;
      font-size: 26px;
    }

    .mfa-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: #818CF8;
      border-radius: 9999px;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
    }

    .mfa-title {
      font-size: 22px; font-weight: 800;
      color: #FFFFFF; margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .mfa-subtitle {
      font-size: 13px; color: var(--text-muted);
      margin-bottom: 26px; line-height: 1.5;
    }
    .mfa-email {
      color: #F3F4F6; font-weight: 700;
    }

    .otp-input {
      width: 100%;
      padding: 14px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      font-size: 26px; font-weight: 800;
      letter-spacing: 12px; text-align: center;
      color: #FFFFFF;
      margin-bottom: 20px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .otp-input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-verify {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);
      color: #FFFFFF; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.35);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit;
    }
    .btn-verify:hover {
      background: linear-gradient(135deg, #4338CA 0%, #3730A3 100%);
      box-shadow: 0 6px 22px rgba(79, 70, 229, 0.45);
      transform: translateY(-1px);
    }

    .error-msg {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      font-size: 12px; font-weight: 600;
      padding: 12px 14px; border-radius: 12px;
      margin-bottom: 20px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .return-link {
      margin-top: 24px; display: inline-block;
      font-size: 12px; color: var(--text-dark);
      text-decoration: none; transition: color 0.2s;
    }
    .return-link:hover { color: var(--text-muted); }

    .security-footer {
      margin-top: 26px; padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex; align-items: center; justify-content: space-around;
    }
    .sec-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 600; color: var(--text-dark);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .sec-item i { font-size: 13px; color: #818CF8; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div class="bg-mesh"></div>

  <div class="mfa-wrap">
    <div class="mfa-box">

      <div class="mfa-logo">
        <i class="ti ti-shield-lock"></i>
      </div>

      <div class="mfa-badge">
        <i class="ti ti-lock"></i> Zero-Trust MFA Active
      </div>

      <div class="mfa-title">Verification Code Required</div>
      <div class="mfa-subtitle">
        A 6-digit security verification code has been dispatched to your registered address: <br>
        <span class="mfa-email">{{ email or username }}</span>
      </div>

      {% if error %}
      <div class="error-msg">
        <i class="ti ti-alert-circle"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/mfa_login_verify">
        <input type="text" name="mfa_code" class="otp-input" placeholder="000000" maxlength="6" autofocus required autocomplete="off" />
        <button type="submit" class="btn-verify">
          <i class="ti ti-check"></i> Verify &amp; Complete Sign In
        </button>
      </form>

      <div>
        <a href="/logout" class="return-link"><i class="ti ti-arrow-left"></i> Cancel &amp; Return to Sign In</a>
      </div>

      <div class="security-footer">
        <div class="sec-item"><i class="ti ti-shield-check"></i> TLS 1.3</div>
        <div class="sec-item"><i class="ti ti-key"></i> MFA Protected</div>
        <div class="sec-item"><i class="ti ti-certificate"></i> SOC 2 Type II</div>
      </div>

    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 30; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.5 + 0.8
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < particles.length; i++) {
          let p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(129, 140, 248, 0.3)';
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            let p2 = particles[j];
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 110) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(99, 102, 241, ${0.15 * (1 - dist / 110)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

</body>
</html>
