<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MagHR Premier — Enterprise Portal Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #070B19;
      --card: rgba(13, 20, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #4F46E5;
      --accent-hover: #4338CA;
      --accent-light: rgba(99, 102, 241, 0.15);
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-dark: #6B7280;
      --input-bg: rgba(255, 255, 255, 0.03);
      --input-border: rgba(255, 255, 255, 0.1);
      --input-focus: #6366F1;
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.3);
      --error-text: #FCA5A5;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
      color: var(--text-main);
    }

    /* ── ANIMATED CANVAS & AMBIENT MESH ── */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    .bg-mesh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 15% 15%, rgba(79, 70, 229, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 85% 85%, rgba(99, 102, 241, 0.12) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(16, 185, 129, 0.04) 0%, transparent 50%);
    }

    /* ── CARD CONTAINER ── */
    .login-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 440px;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 44px 38px 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 24px 64px -12px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── BRANDING ── */
    .brand {
      text-align: center;
      margin-bottom: 34px;
    }
    .brand-logo {
      width: 58px; height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
      color: #FFFFFF;
      font-size: 26px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }
    .brand-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #818CF8;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 3px 10px;
      border-radius: 9999px;
    }

    /* ── FORM FIELDS ── */
    .field-group {
      margin-bottom: 20px;
    }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .field-relative {
      position: relative;
    }
    .field-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dark);
      font-size: 18px;
      pointer-events: none;
      transition: color 0.2s;
    }
    .field-input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .field-input::placeholder {
      color: var(--text-dark);
    }
    .field-input:focus {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }
    .field-input:focus ~ .field-icon {
      color: #818CF8;
    }

    /* ── PASSWORD TOGGLE ── */
    .toggle-password {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-dark);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-password:hover {
      color: var(--text-muted);
    }

    /* ── ERROR ALERT ── */
    .alert-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--error-text);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── ACTION BUTTON ── */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);
      border: none;
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #4338CA 0%, #3730A3 100%);
      box-shadow: 0 6px 22px rgba(79, 70, 229, 0.45);
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER LINKS ── */
    .form-meta {
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .form-meta a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
      font-weight: 500;
    }
    .form-meta a:hover {
      color: #FFFFFF;
    }
    .form-meta .forgot-link {
      color: #818CF8;
      font-weight: 600;
    }
    .form-meta .forgot-link:hover {
      color: #A5B4FC;
    }

    /* ── SECURITY FOOTER STRIP ── */
    .security-footer {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .sec-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sec-item i {
      font-size: 13px;
      color: #818CF8;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div class="bg-mesh"></div>

  <div class="login-wrap">
    <div class="card">

      <!-- BRANDING HEADER -->
      <div class="brand">
        <div class="brand-logo">
          <i class="ti ti-shield-lock"></i>
        </div>
        <div class="brand-name">MagHR Premier</div>
        <div>
          <span class="brand-badge">
            {% if co and co.company_name %}{{ co.company_name }}{% else %}Enterprise SaaS Portal{% endif %}
          </span>
        </div>
      </div>

      <!-- ERROR NOTIFICATION -->
      {% if error %}
      <div class="alert-error">
        <i class="ti ti-alert-circle"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- SIGN IN FORM -->
      <form id="login-form" action="/admin_login" method="POST" autocomplete="on" onsubmit="onSubmit()">
        
        <div class="field-group">
          <label class="field-label">Username / Email / Employee ID</label>
          <div class="field-relative">
            <i class="ti ti-user field-icon"></i>
            <input class="field-input" type="text" name="identifier"
                   id="identifier-input"
                   placeholder="Enter your Username, Email, or Employee ID"
                   required autofocus autocomplete="username" />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="field-relative">
            <i class="ti ti-lock field-icon"></i>
            <input class="field-input" type="password" name="password"
                   id="password-input"
                   placeholder="Enter your password"
                   required autocomplete="current-password"
                   style="padding-right: 44px;" />
            <button type="button" class="toggle-password" onclick="togglePwd()" title="Toggle password visibility">
              <i class="ti ti-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        {% if show_captcha %}
        <div style="margin-bottom: 20px; display: flex; justify-content: center;">
          <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-theme="dark"></div>
          <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
        </div>
        {% endif %}

        <button type="submit" class="btn-submit" id="submit-btn">
          <span id="btn-text">Sign In to Portal</span>
          <i class="ti ti-arrow-right" id="btn-icon"></i>
          <div class="btn-spinner" id="btn-spinner"></div>
        </button>
      </form>

      <!-- NAVIGATION META LINKS -->
      <div class="form-meta">
        <a href="/"><i class="ti ti-scan"></i> Attendance Scanner</a>
        <a href="/admin_forgot_password" class="forgot-link">Forgot password?</a>
      </div>

      <!-- SECURITY CERTIFICATIONS STRIP -->
      <div class="security-footer">
        <div class="sec-item"><i class="ti ti-shield-check"></i> TLS 1.3</div>
        <div class="sec-item"><i class="ti ti-key"></i> Zero-Trust MFA</div>
        <div class="sec-item"><i class="ti ti-certificate"></i> SOC 2 Type II</div>
      </div>

    </div>
  </div>

  <script>
    // ── PASSWORD VISIBILITY TOGGLE ──
    function togglePwd() {
      const input = document.getElementById('password-input');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ti ti-eye-off';
      } else {
        input.type = 'password';
        icon.className = 'ti ti-eye';
      }
    }

    // ── SUBMIT LOADING ANIMATION ──
    function onSubmit() {
      const btn = document.getElementById('submit-btn');
      const txt = document.getElementById('btn-text');
      const icon = document.getElementById('btn-icon');
      const spinner = document.getElementById('btn-spinner');
      btn.disabled = true;
      txt.style.display = 'none';
      icon.style.display = 'none';
      spinner.style.display = 'block';
    }

    // ── SUBTLE CONSTELLATION CANVAS PARTICLES ──
    (function() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.5 + 0.8
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < particles.length; i++) {
          let p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(129, 140, 248, 0.3)';
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            let p2 = particles[j];
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 110) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(99, 102, 241, ${0.15 * (1 - dist / 110)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

</body>
</html>
