# Enterprise PgBouncer Connection Pool Configuration
[databases]
employee_attendance = host=127.0.0.1 port=5432 dbname=employee_attendance

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
max_db_connections = 100
so_reuseport = 1
